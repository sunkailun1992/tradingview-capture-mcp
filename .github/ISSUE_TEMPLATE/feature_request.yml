name: 功能建议 / Feature request
description: 建议新的采集能力或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        本项目只负责导出图表数据和截图；上传、分析或交易相关的功能不在范围内。
        This project only exports chart data and screenshots; uploading, analysis and trading features are out of scope.
  - type: textarea
    id: need
    attributes:
      label: 要解决的问题 / The problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法 / Proposal
      description: 会不会改变输出格式或 MCP 工具参数？
