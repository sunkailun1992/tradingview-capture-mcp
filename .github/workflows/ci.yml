name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag (there is no v10), so pin a full release.
      - uses: astral-sh/setup-uv@v10.3.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q
      - run: node --test "tests/js/*.test.mjs"

  private-content:
    name: private-content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-private-content.sh
